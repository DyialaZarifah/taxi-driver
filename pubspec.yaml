name: taxi_driver
description: "Taxi Driver App - Syria"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Network
  dio: ^5.4.0
  shared_preferences: ^2.2.2

  # UI
  flutter_screenutil: ^5.9.0

  # Utils
  intl: ^0.19.0
  file_picker: ^8.0.0+1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true